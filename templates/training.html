{% extends 'base.html' %}
 {% block content %}
    <div class="card">
        <h2>Entrenar Modelos</h2>
        <p>Selecciona el modelo que deseas entrenar y haz clic en el botón "Entrenar". Este proceso puede tardar unos minutos.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="model">Selecciona un modelo:</label>
            <select name="model" id="model">
                <option value="logistic">Regresión Logística</option>
                <option value="svm">SVM</option>
                <option value="ann">Red Neuronal</option>
                <option value="fcm">Mapa Cognitivo Difuso</option>
            </select>
            <button type="submit">Entrenar</button>
        </form>
    </div>
 {% endblock %}
