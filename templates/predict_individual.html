{% extends 'base.html' %}
{% block content %}
<h2>Predicción Individual</h2>
<p><strong>Instrucciones:</strong> Por favor, ingresa valores válidos en cada campo.</p>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="model">Modelo:</label>
    <select name="model" id="model">
        <option value="logistic_regression">Regresión Logística</option>
        <option value="svm">SVM</option>
        <option value="ann">Red Neuronal</option>
        <option value="fcm">FCM</option>
    </select><br><br>

    <label for="C1">C1 - Edad de la madre (15 a 50 años):</label>
    <input type="number" id="C1" name="C1" required><br>
    <label for="C2">C2 - Índice de masa corporal (15 a 40):</label>
    <input type="number" step="any" id="C2" name="C2" required><br>
    <label for="C3">C3 - Edad gestacional al parto (20 a 42 semanas):</label>
    <input type="number" step="any" id="C3" name="C3" required><br>
    <label for="C4">C4 - Número de embarazos (1 a 10):</label>
    <input type="number" id="C4" name="C4" required><br>
    <label for="C5">C5 - Número de partos previos (0 a 10):</label>
    <input type="number" id="C5" name="C5" required><br>
    <label for="C6">C6 - Síntoma inicial (0=Edema, 1=Hipertensión, 2=FGR):</label>
    <input type="number" id="C6" name="C6" required><br>
    <label for="C7">C7 - Edad gestacional de aparición de síntomas iniciales (20 a 40):</label>
    <input type="number" step="any" id="C7" name="C7" required><br>
    <label for="C8">C8 - Días entre IOS y parto (0 a 100):</label>
    <input type="number" step="any" id="C8" name="C8" required><br>
    <label for="C9">C9 - Edad gestacional de inicio de hipertensión (20 a 40):</label>
    <input type="number" step="any" id="C9" name="C9" required><br>
    <label for="C10">C10 - Días entre hipertensión y parto (0 a 100):</label>
    <input type="number" step="any" id="C10" name="C10" required><br>
    <label for="C11">C11 - Edad gestacional de inicio de edema (20 a 40):</label>
    <input type="number" step="any" id="C11" name="C11" required><br>
    <label for="C12">C12 - Días entre edema y parto (0 a 100):</label>
    <input type="number" step="any" id="C12" name="C12" required><br>
    <label for="C13">C13 - Edad gestacional de inicio de proteinuria (20 a 40):</label>
    <input type="number" step="any" id="C13" name="C13" required><br>
    <label for="C14">C14 - Días entre proteinuria y parto (0 a 100):</label>
    <input type="number" step="any" id="C14" name="C14" required><br>
    <label for="C15">C15 - Tratamiento expectante (0=No, 1=Sí):</label>
    <input type="number" id="C15" name="C15" required><br>
    <label for="C16">C16 - Terapia antihipertensiva antes de hospitalización (0=No, 1=Sí):</label>
    <input type="number" id="C16" name="C16" required><br>
    <label for="C17">C17 - Historial médico (0=No, 1=Hipertensión, 2=SOP):</label>
    <input type="number" id="C17" name="C17" required><br>
    <label for="C18">C18 - Presión sistólica máxima (90 a 200 mmHg):</label>
    <input type="number" id="C18" name="C18" required><br>
    <label for="C19">C19 - Presión diastólica máxima (60 a 130 mmHg):</label>
    <input type="number" id="C19" name="C19" required><br>
    <label for="C20">C20 - Motivo del parto (0=HELLP, 1=Distress fetal, 2=Disfunción orgánica, 3=HTA no controlada, 4=Edema, 5=FGR):</label>
    <input type="number" id="C20" name="C20" required><br>
    <label for="C21">C21 - Modo de parto (0=Cesárea, 1=Parto vaginal):</label>
    <input type="number" id="C21" name="C21" required><br>
    <label for="C22">C22 - Valor máximo de BNP (0 a 500 pg/mL):</label>
    <input type="number" step="any" id="C22" name="C22" required><br>
    <label for="C23">C23 - Creatinina máxima (0.5 a 2.0 mg/dL):</label>
    <input type="number" step="any" id="C23" name="C23" required><br>
    <label for="C24">C24 - Ácido úrico máximo (3.0 a 10.0 mg/dL):</label>
    <input type="number" step="any" id="C24" name="C24" required><br>
    <label for="C25">C25 - Proteinuria máxima (0.1 a 10.0 g/24h):</label>
    <input type="number" step="any" id="C25" name="C25" required><br>
    <label for="C26">C26 - Proteína total máxima (3.0 a 8.0 g/dL):</label>
    <input type="number" step="any" id="C26" name="C26" required><br>
    <label for="C27">C27 - Albúmina máxima (2.0 a 5.0 g/dL):</label>
    <input type="number" step="any" id="C27" name="C27" required><br>
    <label for="C28">C28 - ALT máxima (5 a 100 U/L):</label>
    <input type="number" step="any" id="C28" name="C28" required><br>
    <label for="C29">C29 - AST máxima (5 a 100 U/L):</label>
    <input type="number" step="any" id="C29" name="C29" required><br>
    <label for="C30">C30 - Plaquetas máximas (100000 a 500000 /μL):</label>
    <input type="number" step="any" id="C30" name="C30" required><br><br>

    <button type="submit">Predecir</button>
</form>

{% if prediction %}
<h3>Resultado: {{ prediction }}</h3>
{% endif %}
{% endblock %}
